<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCENT POINTS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f1f1f1;
      text-align: center;
      display: none;
    }

    .points {
      font-size: 38px;
      font-weight: bold;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .whatsapp {
      display: block;
      margin-top: 18px;
      padding: 15px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>SCENT POINTS</h1>
  <div class="sub">نظام نقاط عملاء Scent Laundry</div>

  <label>رقم هاتف العميل</label>

  <input
    id="phone"
    type="tel"
    placeholder="مثال: 0795942926"
  >

  <label>قيمة الفاتورة بالدينار</label>

  <input
    id="amount"
    type="number"
    step="0.01"
    placeholder="مثال: 7.50"
  >

  <button onclick="addPoints()">
    إضافة النقاط
  </button>

  <div id="result" class="result"></div>

</div>


<script>

const SUPABASE_URL =
  "https://lmygnqamyvrahygjswiv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1wVVVVV37dHaDB8hF4YtYQ_-BWLuinR";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function addPoints() {

  const phoneInput =
    document.getElementById("phone").value.trim();

  const amount =
    parseFloat(
      document.getElementById("amount").value
    );

  const result =
    document.getElementById("result");

  result.style.display = "block";
  result.innerHTML = "";


  if (!phoneInput) {

    result.innerHTML =
      '<div class="error">اكتب رقم هاتف العميل</div>';

    return;
  }


  if (!amount || amount <= 0) {

    result.innerHTML =
      '<div class="error">اكتب قيمة الفاتورة</div>';

    return;
  }


  // كل دينار كامل = نقطة
  const pointsToAdd =
    Math.floor(amount);


  if (pointsToAdd < 1) {

    result.innerHTML =
      '<div class="error">الفاتورة أقل من دينار، ما بتنضاف نقاط</div>';

    return;
  }


  try {

    // البحث عن العميل
    const { data: customer, error: searchError } =
      await supabaseClient
        .from("customers")
        .select("*")
        .eq("phone", phoneInput)
        .maybeSingle();


    if (searchError) {
      throw searchError;
    }


    let newPoints =
      pointsToAdd;


    // العميل موجود
    if (customer) {

      newPoints =
        (customer.points || 0) + pointsToAdd;


      const { error: updateError } =
        await supabaseClient
          .from("customers")
          .update({
            points: newPoints
          })
          .eq("phone", phoneInput);


      if (updateError) {
        throw updateError;
      }

    }


    // العميل جديد
    else {

      const { error: insertError } =
        await supabaseClient
          .from("customers")
          .insert({
            phone: phoneInput,
            points: pointsToAdd
          });


      if (insertError) {
        throw insertError;
      }

    }


    // تسجيل الفاتورة
    const { error: transactionError } =
      await supabaseClient
        .from("transactions")
        .insert({
          phone: phoneInput,
          amount: amount,
          points_added: pointsToAdd
        });


    if (transactionError) {
      throw transactionError;
    }


    // النتيجة
    result.innerHTML = `

      <div class="success">
        تمت إضافة النقاط بنجاح ✅
      </div>

      <p>
        تمت إضافة
        <strong>${pointsToAdd}</strong>
        نقطة ⭐
      </p>

      <div class="points">
        ${newPoints}
      </div>

      <p>
        نقطة في رصيد العميل
      </p>

    `;


    // رسالة واتساب
    let whatsappNumber =
      phoneInput.replace(/\D/g, "");


    // تحويل 079xxxxxxx إلى 96279xxxxxxx
    if (whatsappNumber.startsWith("0")) {

      whatsappNumber =
        "962" + whatsappNumber.substring(1);

    }

    // إذا كتب 962 أصلاً، نخليه كما هو
    else if (!whatsappNumber.startsWith("962")) {

      whatsappNumber =
        "962" + whatsappNumber;

    }


    let message;


    if (newPoints >= 25) {

      message = `🎉 Scent Laundry

تمت إضافة ${pointsToAdd} نقطة ⭐

رصيدك الحالي:
${newPoints} نقطة

🎁 مبروك!
وصلت إلى 25 نقطة، وإلك أي خدمة من Scent Laundry مجانًا ❤️

شكراً لثقتك فينا 🙏`;

    }

    else {

      message = `🎉 Scent Laundry

تمت إضافة ${pointsToAdd} نقطة ⭐

رصيدك الحالي:
${newPoints} نقطة

باقي لك ${25 - newPoints} نقطة للوصول إلى مكافأتك 🎁

شكراً لثقتك فينا ❤️`;

    }


    const whatsappLink =
      "https://wa.me/" +
      whatsappNumber +
      "?text=" +
      encodeURIComponent(message);


    result.innerHTML += `

      <a
        class="whatsapp"
        href="${whatsappLink}"
        target="_blank"
      >
        📱 إرسال رسالة واتساب
      </a>

    `;


    // تنبيه الوصول إلى 25
    if (newPoints >= 25) {

      result.innerHTML += `

        <hr>

        <div class="success">

          🎉 العميل وصل إلى 25 نقطة!

          <br><br>

          🎁 إله أي خدمة من
          Scent Laundry
          مجانًا

        </div>

      `;

    }


    // تفريغ الفاتورة
    document.getElementById("amount").value = "";


  }

  catch (error) {

    console.error(error);


    result.innerHTML = `

      <div class="error">

        صار خطأ أثناء إضافة النقاط ❌

      </div>

      <small>

        ${error.message || ""}

      </small>

    `;

  }

}

</script>

</body>
</html>
